<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
  <meta name="theme-color" content="#05050A">
  <meta name="color-scheme" content="dark">
  <title>Astralanime</title>
  <link rel="icon" href="img/app-icon.png" type="image/png">
  <link rel="apple-touch-icon" href="img/app-icon.png">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>

  <div class="boot" id="boot">
    <img src="img/app-icon.png" alt="Astralanime">
  </div>

  <main id="app"></main>

  <nav class="nav" id="nav" aria-label="Main">
    <button data-go="home" aria-current="page">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.2 12 3l9 7.2V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>
      Home
    </button>
    <button data-go="search">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      Search
    </button>
    <button data-go="library">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h6v16H4zM14 4h6v16h-6zM4 9h6M14 9h6"/></svg>
      Library
    </button>
    <button data-go="downloads">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12M7 10l5 5 5-5"/><path d="M5 20h14"/></svg>
      Downloads
    </button>
    <button data-go="settings">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9 7 7M17 17l2.1 2.1M19.1 4.9 17 7M7 17l-2.1 2.1"/></svg>
      Settings
    </button>
  </nav>

  <script src="js/media-provider.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
